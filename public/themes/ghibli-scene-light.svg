<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- soft sun -->
  <circle cx="660" cy="80" r="46" fill="#fff3d6" fill-opacity="0.9" />
  <!-- far hills -->
  <path d="M0 220 C 120 170, 260 190, 400 210 C 540 230, 680 170, 800 200 L 800 400 L 0 400 Z" fill="#cfe6c8" fill-opacity="0.7" />
  <!-- near hills -->
  <path d="M0 270 C 140 230, 300 260, 460 240 C 620 220, 700 260, 800 250 L 800 400 L 0 400 Z" fill="#a9d19e" fill-opacity="0.75" />
  <!-- tree -->
  <g transform="translate(120,250)">
    <rect x="-4" y="20" width="8" height="34" fill="#7c5b3e" fill-opacity="0.6" rx="2" />
    <circle cx="0" cy="0" r="26" fill="#6fa25e" fill-opacity="0.7" />
    <circle cx="-18" cy="14" r="18" fill="#6fa25e" fill-opacity="0.6" />
    <circle cx="18" cy="14" r="18" fill="#6fa25e" fill-opacity="0.6" />
  </g>
  <!-- small bird silhouettes -->
  <g stroke="#5c7a52" stroke-opacity="0.55" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M520 90 q10 -12 20 0 q10 -12 20 0" />
    <path d="M580 60 q8 -10 16 0 q8 -10 16 0" />
  </g>
  <!-- fox silhouette resting on the hill -->
  <g transform="translate(320,258)" fill="#c98a4f" fill-opacity="0.55">
    <path d="M0 20 C -4 4 8 -10 24 -8 C 34 -18 46 -14 46 -2 C 58 -4 62 10 52 16 C 54 24 46 30 36 26 C 28 34 8 32 0 20 Z" />
    <path d="M20 -9 L14 -20 L26 -12 Z" />
