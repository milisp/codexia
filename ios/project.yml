# XcodeGen spec — run `xcodegen generate` in this directory to produce
# Codexia.xcodeproj. The project file is generated rather than committed so it
# does not become a merge-conflict magnet.
name: Codexia
options:
  bundleIdPrefix: dev.milisp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Codexia:
    type: application
    platform: iOS
    sources:
      - path: Codexia
        excludes:
          - Info.plist
    info:
      path: Codexia/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad multitasking requires all four orientations unless the app opts
        # out of it with UIRequiresFullScreen.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The desktop serves plain HTTP on the tailnet, so ATS has to allow it
        # for MagicDNS names. WireGuard already encrypts that hop. The exception
        # is scoped to ts.net rather than enabling arbitrary loads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.milisp.codexia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
