name: Release Windows Portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload to (e.g. v0.43.0)"
        required: false
        type: string

env:
  VITE_REDIRECT_URL: ${{ secrets.VITE_REDIRECT_URL }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-windows-portable:
    runs-on: windows-latest
    name: Build Windows x86_64 portable
    permissions:
      contents: write

    steps:
      - name: Resolve target tag
        id: target
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # No --bundles: the portable build only needs the raw executable.
      - name: Build Tauri App
        run: bun tauri build --no-bundle

      - name: Package portable archive
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.target.outputs.tag }}" -replace '^v', ''
          $name = "Codexia_${version}_windows_x64_portable"
          New-Item -ItemType Directory -Force -Path dist-portable | Out-Null
          Copy-Item target/release/codexia.exe dist-portable/
          Compress-Archive -Path dist-portable/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash" | Out-File -Encoding ascii -NoNewline "$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.target.outputs.tag }}" `
            "${{ steps.package.outputs.name }}.zip" `
            "${{ steps.package.outputs.name }}.zip.sha256" `
            --clobber
