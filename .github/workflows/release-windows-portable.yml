name: Release Windows Portable

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  VITE_REDIRECT_URL: ${{ secrets.VITE_REDIRECT_URL }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-windows-portable:
    runs-on: windows-latest
    name: Build Windows x86_64 portable
    permissions:
      contents: write

    steps:
      - name: Fetch release tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag matches project version
        id: target
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          git rev-parse --verify "refs/tags/$TAG" >/dev/null || { echo "::error::Release tag $TAG does not exist"; exit 1; }
          PACKAGE_VERSION=$(git show "$TAG:package.json" | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>console.log(JSON.parse(s).version))")
          CARGO_VERSION=$(git show "$TAG:Cargo.toml" | sed -n '/^\[workspace.package\]/,/^\[/p' | sed -n 's/^version *= *"\([^"]*\)".*/\1/p')
          [[ "$TAG" == "v$PACKAGE_VERSION" && "$PACKAGE_VERSION" == "$CARGO_VERSION" ]] || { echo "::error::Tag $TAG != package.json $PACKAGE_VERSION or Cargo.toml $CARGO_VERSION"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Read pinned keke version
        shell: bash
        run: |
          VERSION=$(cat .github/keke-version)
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Invalid keke version: $VERSION" >&2; exit 1; }
          echo "KEKE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Checkout keke
        uses: actions/checkout@v7
        with:
          repository: milisp/keke-agent
          ref: ${{ env.KEKE_VERSION }}
          path: keke-agent

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            keke-agent

      # Built from source so this CI does not inflate keke's download counts.
      - name: Build keke sidecar
        shell: bash
        run: |
          cd keke-agent
          rustup toolchain install --profile minimal
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --locked -p keke-cli --target x86_64-pc-windows-msvc
          cd ..
          mkdir -p src-tauri/binaries
          cp keke-agent/target/x86_64-pc-windows-msvc/release/keke.exe src-tauri/binaries/keke-x86_64-pc-windows-msvc.exe

      - name: Setup Node.js
        uses: actions/setup-node@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # No --bundles: the portable build only needs the raw executable.
      - name: Build Tauri App
        env:
          # Repo variable; empty or unset builds without telemetry.
          CODEXIA_TELEMETRY_URL: ${{ vars.CODEXIA_TELEMETRY_URL }}
        run: bun tauri build --no-bundle --config src-tauri/tauri.keke.conf.json

      - name: Package portable archive
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.target.outputs.tag }}" -replace '^v', ''
          $name = "codexia_${version}_x64_portable"
          New-Item -ItemType Directory -Force -Path dist-portable | Out-Null
          Copy-Item target/release/codexia.exe dist-portable/
          # Sidecar sits next to the app exe, where the ACP resolver looks for it.
          Copy-Item src-tauri/binaries/keke-x86_64-pc-windows-msvc.exe dist-portable/keke.exe
          Compress-Archive -Path dist-portable/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash" | Out-File -Encoding ascii -NoNewline "$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.target.outputs.tag }}" `
            "${{ steps.package.outputs.name }}.zip" `
            "${{ steps.package.outputs.name }}.zip.sha256" `
            --clobber
