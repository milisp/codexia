name: Publish Cross-Platform

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_REDIRECT_URL: ${{ secrets.VITE_REDIRECT_URL }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  TAURI_BUNDLE: all

jobs:
  sync-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      section: ${{ steps.notes.outputs.section }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Validate pushed tag matches project version
        id: target
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$REF_NAME"
          git rev-parse --verify "refs/tags/$TAG" >/dev/null || { echo "::error::Release tag $TAG does not exist"; exit 1; }
          PACKAGE_VERSION=$(git show "$TAG:package.json" | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>console.log(JSON.parse(s).version))")
          CARGO_VERSION=$(git show "$TAG:Cargo.toml" | sed -n '/^\[workspace.package\]/,/^\[/p' | sed -n 's/^version *= *"\([^"]*\)".*/\1/p')
          [[ "$TAG" == "v$PACKAGE_VERSION" && "$PACKAGE_VERSION" == "$CARGO_VERSION" ]] || { echo "::error::Tag $TAG != package.json $PACKAGE_VERSION or Cargo.toml $CARGO_VERSION"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure CHANGELOG.md has an entry for this tag
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          GITHUB_REF_NAME="$RELEASE_TAG"
          VERSION="${GITHUB_REF_NAME#v}"
          SECTION=$(awk -v ver="[$VERSION]" '
            /^## \[/ { if (found) exit; if (index($0, ver)) { found=1; next } }
            found { print }
          ' CHANGELOG.md)

          if [[ -z "${SECTION}" ]]; then
            echo "No CHANGELOG.md entry for ${VERSION} yet; auto-generating one from commit history."
            PREV_TAG=$(git tag --sort=-v:refname | grep -vF "${GITHUB_REF_NAME}" | head -1 || true)
            DATE=$(date +%Y-%m-%d)
            RANGE="${PREV_TAG:+${PREV_TAG}..}${GITHUB_REF_NAME}"
            ENTRY=$(mktemp)
            {
              echo "## [${VERSION}] - ${DATE}"
              echo
              git log "${RANGE}" --pretty=format:"- %s (\`%h\`)" --no-merges
              echo
              echo
            } > "${ENTRY}"

            FIRST_SECTION_LINE=$(grep -n '^## \[' CHANGELOG.md | head -1 | cut -d: -f1)
            {
              head -n $((FIRST_SECTION_LINE - 1)) CHANGELOG.md
              cat "${ENTRY}"
              tail -n "+${FIRST_SECTION_LINE}" CHANGELOG.md
            } > CHANGELOG.md.new
            mv CHANGELOG.md.new CHANGELOG.md
            rm -f "${ENTRY}"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore: auto-generate changelog entry for ${VERSION}"
            git push origin HEAD:master

            SECTION=$(awk -v ver="[$VERSION]" '
              /^## \[/ { if (found) exit; if (index($0, ver)) { found=1; next } }
              found { print }
            ' CHANGELOG.md)
          fi

          {
            echo 'section<<EOF'
            echo "${SECTION}"
            printf '\nEOF\n'
          } >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: sync-changelog
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: ""
          - platform: "macos-latest"
            args: '--target x86_64-apple-darwin'
          - platform: "ubuntu-24.04"
            args: ""
          - platform: "ubuntu-22.04-arm"
            args: "--bundles deb"
          - platform: "windows-latest"
            args: ""
          - platform: "windows-latest"
            args: "--target aarch64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync-changelog.outputs.tag }}

      - name: setup node
        uses: actions/setup-node@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc,aarch64-pc-windows-msvc' || '' }}

      - name: Import Apple Developer Certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
      - name: Verify Certificate
        if: runner.os == 'macOS'
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> "$GITHUB_ENV"
          echo "Certificate imported."

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libasound2-dev

      - name: install frontend dependencies
        run: bun install

      # keke ships as a Tauri sidecar. Built from source (not downloaded from
      # keke's releases) so this CI does not inflate keke's download counts.
      - name: Resolve keke target triple
        id: keke
        shell: bash
        env:
          MATRIX_ARGS: ${{ matrix.args }}
        run: |
          TRIPLE=$(echo "$MATRIX_ARGS" | sed -n 's/.*--target[= ]\([^ ]*\).*/\1/p')
          if [[ -z "$TRIPLE" ]]; then
            TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          fi
          echo "triple=$TRIPLE" >> "$GITHUB_OUTPUT"

      - name: Read pinned keke version
        shell: bash
        run: |
          VERSION=$(cat .github/keke-version)
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Invalid keke version: $VERSION" >&2; exit 1; }
          echo "KEKE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Checkout keke
        uses: actions/checkout@v7
        with:
          repository: milisp/keke-agent
          ref: ${{ env.KEKE_VERSION }}
          path: keke-agent

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            keke-agent
          key: keke-${{ steps.keke.outputs.triple }}

      - name: Build keke sidecar
        shell: bash
        env:
          KEKE_TRIPLE: ${{ steps.keke.outputs.triple }}
        run: |
          cd keke-agent
          # rust-toolchain.toml pins the toolchain; install it and the target for it.
          rustup toolchain install --profile minimal
          rustup target add "$KEKE_TRIPLE"
          cargo build --release --locked -p keke-cli --target "$KEKE_TRIPLE"
          cd ..
          EXT=""
          if [[ "$KEKE_TRIPLE" == *windows* ]]; then EXT=".exe"; fi
          mkdir -p src-tauri/binaries
          cp "keke-agent/target/${KEKE_TRIPLE}/release/keke${EXT}" "src-tauri/binaries/keke-${KEKE_TRIPLE}${EXT}"

      - name: Read Release Notes
        id: notes
        shell: bash
        env:
          SECTION: ${{ needs.sync-changelog.outputs.section }}
        run: |
          {
            echo 'body<<EOF'
            echo "$SECTION"
            printf '\nEOF\n'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          # Repo variable; empty or unset builds without telemetry.
          CODEXIA_TELEMETRY_URL: ${{ vars.CODEXIA_TELEMETRY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
        with:
          tagName: ${{ needs.sync-changelog.outputs.tag }}
          releaseName: ${{ needs.sync-changelog.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.keke.conf.json

      - name: Clean up keychain
        if: runner.os == 'macOS'
        run: |
          security delete-keychain build.keychain
          rm -f certificate.p12

  windows-portable:
    needs: [sync-changelog, publish-tauri]
    permissions:
      contents: write
    uses: ./.github/workflows/release-windows-portable.yml
    with:
      tag: ${{ needs.sync-changelog.outputs.tag }}
    secrets: inherit

  web-packages:
    needs: [sync-changelog, publish-tauri]
    permissions:
      contents: write
    uses: ./.github/workflows/release-web.yml
    with:
      tag: ${{ needs.sync-changelog.outputs.tag }}
    secrets: inherit

  publish-release:
    needs: [sync-changelog, publish-tauri, windows-portable, web-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.sync-changelog.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
