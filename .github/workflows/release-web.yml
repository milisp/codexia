name: Publish Web Packages

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  VITE_REDIRECT_URL: ${{ secrets.VITE_REDIRECT_URL }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

permissions:
  contents: read

jobs:
  publish-web-linux:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl builds run on any Linux distribution, including the
          # older glibc of Debian 12 / Ubuntu 22.04 servers and Alpine.
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            libc: musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            libc: musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # Bundled C sources (SQLite, zstd, ring, mimalloc) compile against
          # musl's headers; host build scripts keep the system compiler.
          target_env="$(echo '${{ matrix.target }}' | tr '-' '_')"
          echo "CC_${target_env}=musl-gcc" >> "$GITHUB_ENV"

      - name: Read pinned keke version
        shell: bash
        run: |
          VERSION=$(cat .github/keke-version)
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Invalid keke version: $VERSION" >&2; exit 1; }
          echo "KEKE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Checkout keke
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: milisp/keke-agent
          ref: ${{ env.KEKE_VERSION }}
          path: keke-agent

      # Built from source so this CI does not inflate keke's download counts.
      # keke's rust-toolchain.toml pins its own channel, so the target is
      # added to that toolchain.
      - name: Build keke sidecar
        shell: bash
        run: |
          cd keke-agent
          rustup toolchain install --profile minimal
          rustup target add ${{ matrix.target }}
          cargo build --release --locked -p keke-cli --target ${{ matrix.target }}
          echo "KEKE_BIN=$PWD/target/${{ matrix.target }}/release/keke" >> "$GITHUB_ENV"

      - name: install frontend dependencies
        run: bun install

      - name: Package web
        env:
          # Repo variable; empty or unset builds without telemetry.
          CODEXIA_TELEMETRY_URL: ${{ vars.CODEXIA_TELEMETRY_URL }}
        run: |
          WEB_TARGET_TRIPLE="${{ matrix.target }}" \
          WEB_ARCH="${{ matrix.arch }}" \
          WEB_LIBC="${{ matrix.libc }}" \
          bash scripts/package-web.sh

      - name: Resolve package path
        shell: bash
        run: |
          version="$(node -e "console.log(require('./package.json').version)")"
          package_path="/tmp/codexia-web-${version}-linux-${{ matrix.arch }}-${{ matrix.libc }}.tar.gz"
          echo "WEB_PACKAGE_PATH=${package_path}" >> "$GITHUB_ENV"

      - name: Upload web package to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$WEB_PACKAGE_PATH" --clobber

  # macOS web packages remain disabled.
  publish-web-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "."

      - name: install frontend dependencies
        run: bun install

      - name: Package web for Windows
        shell: cmd
        run: scripts\package-web.bat

      - name: Resolve package path
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $path = Join-Path $env:TEMP "codexia-web-$version-windows-x86_64.zip"
          "WEB_PACKAGE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload web package to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$WEB_PACKAGE_PATH" --clobber
