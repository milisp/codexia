name: Publish Web Packages

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  VITE_REDIRECT_URL: ${{ secrets.VITE_REDIRECT_URL }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  publish-web-linux:
    permissions:
      contents: write
    env:
      PKG_CONFIG_ALLOW_CROSS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            libc: gnu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: setup node
        uses: actions/setup-node@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: bun install

      - name: Package web
        env:
          # Repo variable; empty or unset builds without telemetry.
          CODEXIA_TELEMETRY_URL: ${{ vars.CODEXIA_TELEMETRY_URL }}
        run: |
          WEB_TARGET_TRIPLE="${{ matrix.target }}" \
          WEB_ARCH="${{ matrix.arch }}" \
          WEB_LIBC="${{ matrix.libc }}" \
          bash scripts/package-web.sh

      - name: Resolve package path
        shell: bash
        run: |
          version="$(node -e "console.log(require('./package.json').version)")"
          package_path="/tmp/codexia-web-${version}-linux-${{ matrix.arch }}-${{ matrix.libc }}.tar.gz"
          echo "WEB_PACKAGE_PATH=${package_path}" >> "$GITHUB_ENV"

      - name: Upload web package to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$WEB_PACKAGE_PATH" --clobber

  # macOS web packages remain disabled.
  publish-web-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: setup node
        uses: actions/setup-node@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: install frontend dependencies
        run: bun install

      - name: Package web for Windows
        shell: cmd
        run: scripts\package-web.bat

      - name: Resolve package path
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $path = Join-Path $env:TEMP "codexia-web-$version-windows-x86_64.zip"
          "WEB_PACKAGE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload web package to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$WEB_PACKAGE_PATH" --clobber
