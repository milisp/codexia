name: CI

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/ci.yml"
      - "src/**"
      - "src-tauri/**"
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - "index.html"
      - "public/**"
      - "tsconfig*.json"
      - "vite.config.*"
      - "vitest.config.*"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "src/**"
      - "src-tauri/**"
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - "index.html"
      - "public/**"
      - "tsconfig*.json"
      - "vite.config.*"
      - "vitest.config.*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    name: Rust clippy & tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libasound2-dev

      # Pinned so new stable releases can't add clippy lints and break CI unannounced; bump deliberately.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # tauri::generate_context! expects frontendDist to exist; the Rust checks don't need real assets.
      - name: Create placeholder frontend dist
        run: mkdir -p dist

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  frontend-checks:
    runs-on: ubuntu-latest
    name: Frontend tests, typecheck & build
    env:
      VITE_REDIRECT_URL: ${{ secrets.VITE_REDIRECT_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Frontend tests
        run: bun run test

      # The build script runs TypeScript checking before Vite.
      - name: Build frontend
        run: bun run build
