name: Publish Windows Patch

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'tag name'
        required: true
        default: 'v0.34.0'

env:
  KEKE_VERSION: v0.1.32
  VITE_REDIRECT_URL: ${{ secrets.VITE_REDIRECT_URL }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  TAURI_BUNDLE: all

jobs:
  publish-tauri:
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "windows-latest"
            args: "--target aarch64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc,aarch64-pc-windows-msvc' || '' }}

      - name: install frontend dependencies
        run: bun install

      # keke ships as a Tauri sidecar. Built from source (not downloaded from
      # keke's releases) so this CI does not inflate keke's download counts.
      - name: Resolve keke target triple
        id: keke
        shell: bash
        env:
          MATRIX_ARGS: ${{ matrix.args }}
        run: |
          TRIPLE=$(echo "$MATRIX_ARGS" | sed -n 's/.*--target[= ]\([^ ]*\).*/\1/p')
          if [[ -z "$TRIPLE" ]]; then
            TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          fi
          echo "triple=$TRIPLE" >> "$GITHUB_OUTPUT"

      - name: Checkout keke
        uses: actions/checkout@v7
        with:
          repository: milisp/keke-agent
          ref: ${{ env.KEKE_VERSION }}
          path: keke-agent

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            keke-agent
          key: keke-${{ steps.keke.outputs.triple }}

      - name: Build keke sidecar
        shell: bash
        env:
          KEKE_TRIPLE: ${{ steps.keke.outputs.triple }}
        run: |
          cd keke-agent
          # rust-toolchain.toml pins the toolchain; install it and the target for it.
          rustup toolchain install --profile minimal
          rustup target add "$KEKE_TRIPLE"
          cargo build --release --locked -p keke-cli --target "$KEKE_TRIPLE"
          cd ..
          EXT=""
          if [[ "$KEKE_TRIPLE" == *windows* ]]; then EXT=".exe"; fi
          mkdir -p src-tauri/binaries
          cp "keke-agent/target/${KEKE_TRIPLE}/release/keke${EXT}" "src-tauri/binaries/keke-${KEKE_TRIPLE}${EXT}"

      - name: Read Release Notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ inputs.tag_name }}"
          VERSION="${VERSION#v}"
          SECTION=$(awk -v ver="[$VERSION]" '
            /^## \[/ { if (found) exit; if (index($0, ver)) { found=1; next } }
            found { print }
          ' CHANGELOG.md)

          if [[ -n "${SECTION}" ]]; then
            {
              echo 'body<<EOF'
              echo "${SECTION}"
              printf '\nEOF\n'
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CHANGELOG.md section found for version ${VERSION}"
            echo "body=🚀 Release ${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          # Repo variable; empty or unset builds without telemetry.
          CODEXIA_TELEMETRY_URL: ${{ vars.CODEXIA_TELEMETRY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag_name }}
          releaseName: "${{ inputs.tag_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.keke.conf.json